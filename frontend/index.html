<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <title>Tu Turno Barber | Barbería & Sistema de Citas</title>
  <meta name="description"
    content="Tu Turno Barber - Reserva tu turno con los mejores barberos, catalogo de servicios, paquetes exclusivos y gestión completa." />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    html,
    body {
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    #root {
      min-height: 100%;
    }
  </style>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("barber_settings");
        var isDark = false;
        if (raw) {
          var parsed = JSON.parse(raw);
          if (typeof parsed?.system?.modo_oscuro === "boolean") {
            isDark = parsed.system.modo_oscuro;
          }
        }
        if (!isDark) {
          var stored = localStorage.getItem("barber_theme_mode");
          if (stored === "dark") isDark = true;
        }
        if (isDark) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        } else {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        }
      } catch (e) {}
    })();
  </script>

</head>

<body>

  <div id="root"></div>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
  <script type="module" src="/src/main.jsx"></script>

</body>

</html>
