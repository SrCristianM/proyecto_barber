<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000" width="2000" height="2000">
  <defs>
    <radialGradient id="corte-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a24b" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#c9a24b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#c9a24b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="blade-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="blade-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="comb-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d11" />
      <stop offset="20%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="80%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1c0c05" />
    </linearGradient>
    <filter id="tool-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#c9a24b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="1000" cy="1000" r="900" fill="url(#corte-ambient)" />

  <g filter="url(#tool-shadow)">
    <!-- COMB (Barber Taper Comb) lying diagonally -->
    <g transform="rotate(-38 1000 1000) translate(600, 300)">
      <!-- Comb spine -->
      <rect x="0" y="320" width="820" height="75" rx="14" fill="url(#comb-body)" stroke="#d97706" stroke-width="2" />
      <!-- Teeth -->
      <!-- Fine teeth section (left) -->
      <rect x="20" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="33" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="46" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="59" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="72" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="85" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="98" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="111" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="124" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="137" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="150" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="163" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="176" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="189" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="202" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="215" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="228" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="241" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="254" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="267" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="280" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="293" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="306" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="319" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="332" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="345" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="358" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="371" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="384" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="397" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/><rect x="410" y="390" width="7" height="150" rx="3" fill="url(#comb-body)" stroke="#92400e" stroke-width="1"/>
      <!-- Wide teeth section (right) -->
      <rect x="430" y="390" width="13" height="150" rx="4" fill="url(#comb-body)" stroke="#92400e" stroke-width="1.5"/><rect x="456" y="390" width="13" height="150" rx="4" fill="url(#comb-body)" stroke="#92400e" stroke-width="1.5"/><rect x="482" y="390" width="13" height="150" rx="4" fill="url(#comb-body)" stroke="#92400e" stroke-width="1.5"/><rect x="508" y="390" width="13" height="150" rx="4" fill="url(#comb-body)" stroke="#92400e" stroke-width="1.5"/><rect x="534" y="390" width="13" height="150" rx="4" fill="url(#comb-body)" stroke="#92400e" stroke-width="1.5"/><rect x="560" y="390" width="13" height="150" rx="4" fill="url(#comb-body)" stroke="#92400e" stroke-width="1.5"/><rect x="586" y="390" width="13" height="150" rx="4" fill="url(#comb-body)" stroke="#92400e" stroke-width="1.5"/><rect x="612" y="390" width="13" height="150" rx="4" fill="url(#comb-body)" stroke="#92400e" stroke-width="1.5"/><rect x="638" y="390" width="13" height="150" rx="4" fill="url(#comb-body)" stroke="#92400e" stroke-width="1.5"/><rect x="664" y="390" width="13" height="150" rx="4" fill="url(#comb-body)" stroke="#92400e" stroke-width="1.5"/><rect x="690" y="390" width="13" height="150" rx="4" fill="url(#comb-body)" stroke="#92400e" stroke-width="1.5"/><rect x="716" y="390" width="13" height="150" rx="4" fill="url(#comb-body)" stroke="#92400e" stroke-width="1.5"/><rect x="742" y="390" width="13" height="150" rx="4" fill="url(#comb-body)" stroke="#92400e" stroke-width="1.5"/><rect x="768" y="390" width="13" height="150" rx="4" fill="url(#comb-body)" stroke="#92400e" stroke-width="1.5"/><rect x="794" y="390" width="13" height="150" rx="4" fill="url(#comb-body)" stroke="#92400e" stroke-width="1.5"/>
      <!-- Gold engraved text on comb -->
      <text x="210" y="365" font-family="'Oswald', sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#fef3c7" opacity="0.85">BARBERBOOK • MASTER COMB</text>
    </g>

    <!-- SCISSORS (Professional Barber Shears) -->
    <g transform="translate(1000, 1000)">
      <!-- Blade 1 (Diagonal top-right to bottom-left) -->
      <g transform="rotate(32)">
        <!-- Lower finger hole / ring -->
        <circle cx="0" cy="560" r="140" fill="none" stroke="url(#gold-grad)" stroke-width="36" />
        <circle cx="0" cy="560" r="122" fill="none" stroke="#1e293b" stroke-width="6" />
        <!-- Tang rest (removable bumper) -->
        <path d="M 120 540 Q 220 560 250 640 Q 230 670 190 650 Q 150 630 110 590 Z" fill="url(#gold-grad)" />
        <circle cx="235" cy="640" r="16" fill="#1e293b" />
        <!-- Shank -->
        <path d="M -22 420 C -22 300 -12 180 -6 0 L 6 0 C 12 180 22 300 22 420 Z" fill="url(#blade-metal)" />
        <!-- Cutting blade -->
        <path d="M -8 0 C -12 -280 -6 -560 0 -840 C 24 -560 36 -280 14 0 Z" fill="url(#blade-metal)" stroke="#94a3b8" stroke-width="2" />
        <!-- Honed cutting edge highlight -->
        <path d="M -8 0 C -12 -280 -6 -560 0 -840 L 4 -820 C -1 -550 -7 -280 -4 0 Z" fill="url(#blade-edge)" />
      </g>

      <!-- Blade 2 (Diagonal top-left to bottom-right) -->
      <g transform="rotate(-32)">
        <!-- Thumb ring -->
        <circle cx="0" cy="560" r="130" fill="none" stroke="url(#gold-grad)" stroke-width="36" />
        <circle cx="0" cy="560" r="112" fill="none" stroke="#1e293b" stroke-width="6" />
        <!-- Rubber bumper -->
        <circle cx="105" cy="465" r="18" fill="#1e293b" stroke="#475569" stroke-width="3" />
        <!-- Shank -->
        <path d="M -22 420 C -22 300 -12 180 -6 0 L 6 0 C 12 180 22 300 22 420 Z" fill="url(#blade-metal)" />
        <!-- Cutting blade -->
        <path d="M 8 0 C 12 -280 6 -560 0 -840 C -24 -560 -36 -280 -14 0 Z" fill="url(#blade-metal)" stroke="#94a3b8" stroke-width="2" />
        <!-- Honed edge -->
        <path d="M 8 0 C 12 -280 6 -560 0 -840 L -4 -820 C 1 -550 7 -280 4 0 Z" fill="url(#blade-edge)" />
      </g>

      <!-- Central Pivot Screw & Tension Dial (Luxury Gold) -->
      <circle cx="0" cy="0" r="58" fill="url(#gold-grad)" stroke="#451a03" stroke-width="4" />
      <circle cx="0" cy="0" r="44" fill="#0f172a" stroke="#d97706" stroke-width="4" />
      <circle cx="0" cy="0" r="28" fill="url(#gold-grad)" />
      <polygon points="0,-18 12,-6 18,12 -6,18 -18,6 -12,-12" fill="#451a03" />
      <!-- Star tension notch details -->
      <circle cx="0" cy="-36" r="4" fill="#fef08a" />
      <circle cx="36" cy="0" r="4" fill="#fef08a" />
      <circle cx="0" cy="36" r="4" fill="#fef08a" />
      <circle cx="-36" cy="0" r="4" fill="#fef08a" />
    </g>
  </g>
</svg>