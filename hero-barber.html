  <!-- Entrada Coreográfica (Blocking Script en <head>) -->
  <script>
    document.documentElement.classList.add('anim');
    (function() {
      var fontGuard = new Promise(function(resolve) { setTimeout(resolve, 500); });
      var fontsReady = ('fonts' in document) ? document.fonts.ready : Promise.resolve();
      Promise.race([fontsReady, fontGuard]).then(function() {
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            document.documentElement.classList.add('play');
            setTimeout(function() {
              document.documentElement.classList.remove('anim', 'play');
            }, 2150);
          });
        });
      });
    })();
  </script>

  <style>
    /* ════════════════════════════════════════════════════════════════════════
       SISTEMA DE DISEÑO — Composición Fija 1353 x 1163 en --u
       ════════════════════════════════════════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --dw: 1353;
      --dh: 1163;
      --gutter: 25;
      --u: max(min(.72px, calc(100vh / 700)), min(calc(100vw / 1353), calc(100vh / 1163)));
      --dh-px: calc(1163 * var(--u));
      --vshift: calc(max(0px, (100vh - var(--dh-px))) * .42);
      --ink: #f4ede1;            /* blanco cálido, no blanco puro */
      --gold: #c9a24b;           /* acento barbería — sustituye cyan */
      --gold-logo: #e0bc6e;
      --rule: rgba(244, 237, 225, .20);
      --btn-ink: #171008;        /* texto sobre botón dorado */
      --font-display: 'Bebas Neue', Georgia, serif;
      --font-body: 'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-logo: 'Oswald', sans-serif;
    }

    @supports (height: 100dvh) {
      :root {
        --u: max(min(.72px, calc(100dvh / 700)), min(calc(100vw / 1353), calc(100dvh / 1163)));
        --vshift: calc(max(0px, (100dvh - var(--dh-px))) * .42);
      }
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      background: #0d0906;
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ════════════════════════════════════════════════════════════════════════
       STAGE & SKY (Fondo de Video y Fallback Still)
       ════════════════════════════════════════════════════════════════════════ */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      width: 100%;
      height: 100%;
    }

    .sky {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-color: #0d0906;
      background-image: url("https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=1920&q=80");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      transition: background-image 0.22s ease-out;
    }

    /* Vignette cinematográfica */
    .sky::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(13, 9, 6, 0.28) 0%, rgba(13, 9, 6, 0.68) 65%, rgba(13, 9, 6, 0.94) 100%),
        linear-gradient(180deg, rgba(13, 9, 6, 0.72) 0%, rgba(13, 9, 6, 0.12) 30%, rgba(13, 9, 6, 0.15) 68%, rgba(13, 9, 6, 0.88) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .sky video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease-out;
      z-index: 0;
    }

    .sky video.is-active {
      opacity: 1;
    }

    /* ════════════════════════════════════════════════════════════════════════
       UI LAYER & NAVBAR
       ════════════════════════════════════════════════════════════════════════ */
    .ui {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .navbar {
      position: absolute;
      top: calc(38 * var(--u));
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      pointer-events: auto;
      z-index: 20;
    }

    .navrow {
      width: calc(1220 * var(--u));
      max-width: calc(100vw - calc(48 * var(--u)));
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .logo {
      font-family: var(--font-logo);
      font-size: calc(26 * var(--u));
      font-weight: 600;
      text-decoration: none;
      color: var(--ink);
      letter-spacing: calc(1.5 * var(--u));
      text-transform: lowercase;
      display: inline-flex;
      align-items: baseline;
      transition: opacity 0.2s ease;
    }

    .logo:hover {
      opacity: 0.9;
    }

    .logo i {
      font-style: italic;
      color: var(--gold-logo);
      font-weight: 500;
      margin-left: calc(1 * var(--u));
    }

    .links {
      display: flex;
      align-items: center;
      gap: calc(36 * var(--u));
    }

    .links a {
      font-family: var(--font-body);
      font-size: calc(14 * var(--u));
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: calc(0.6 * var(--u));
      position: relative;
      padding: calc(6 * var(--u)) 0;
      transition: color 0.2s ease;
    }

    .links a:hover {
      color: #ffffff;
    }

    .links a[aria-current="page"] {
      color: #ffffff;
    }

    .links a[aria-current="page"]::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: calc(2 * var(--u));
      background: var(--gold);
      border-radius: calc(1 * var(--u));
    }

    .enroll {
      background: linear-gradient(180deg, #ffffff 0%, #f3e3bd 9%, #e9d19f 72%, #f7ecd8 100%);
      color: var(--btn-ink) !important;
      font-family: var(--font-logo) !important;
      font-weight: 600 !important;
      font-size: calc(13 * var(--u)) !important;
      letter-spacing: calc(1.5 * var(--u)) !important;
      text-transform: uppercase;
      padding: calc(10 * var(--u)) calc(28 * var(--u)) !important;
      border-radius: calc(50 * var(--u));
      box-shadow: 0 calc(3 * var(--u)) calc(16 * var(--u)) rgba(201, 162, 75, 0.32);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, filter 0.2s ease !important;
    }

    .enroll:hover {
      transform: translateY(calc(-1.5 * var(--u)));
      box-shadow: 0 calc(6 * var(--u)) calc(22 * var(--u)) rgba(201, 162, 75, 0.48);
      filter: brightness(1.04);
    }

    .enroll:active {
      transform: translateY(0);
    }

    .burger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: calc(8 * var(--u));
      flex-direction: column;
      gap: calc(6 * var(--u));
      align-items: center;
      justify-content: center;
      z-index: 110;
      -webkit-tap-highlight-color: transparent;
    }

    .burger span {
      display: block;
      width: calc(24 * var(--u));
      height: calc(2.5 * var(--u));
      background: var(--ink);
      border-radius: calc(2 * var(--u));
      transition: transform 0.26s ease, opacity 0.26s ease;
    }

    .navrow[data-open="true"] .burger span:nth-child(1) {
      transform: translateY(calc(8.5 * var(--u))) rotate(45deg);
    }
    .navrow[data-open="true"] .burger span:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }
    .navrow[data-open="true"] .burger span:nth-child(3) {
      transform: translateY(calc(-8.5 * var(--u))) rotate(-45deg);
    }

    /* ════════════════════════════════════════════════════════════════════════
       COPY COLUMN & CONTENIDO CENTRAL
       x=664 con compensación de --gutter: 25
       ════════════════════════════════════════════════════════════════════════ */
    .copy {
      position: absolute;
      top: calc((280 * var(--u)) + var(--vshift));
      left: calc(50% - calc(var(--gutter) * var(--u) * 0.5));
      transform: translateX(-50%);
      width: calc(1050 * var(--u));
      max-width: calc(100vw - calc(48 * var(--u)));
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      pointer-events: none;
      z-index: 4;
    }

    .copy a, .service {
      pointer-events: auto;
    }

    .col {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .eyebrow {
      font-family: var(--font-logo);
      font-size: calc(17 * var(--u));
      font-weight: 600;
      letter-spacing: calc(8 * var(--u));
      color: var(--ink);
      text-transform: uppercase;
      opacity: 0.95;
    }

    .ent-mask {
      display: inline-block;
      overflow: hidden;
      vertical-align: top;
    }

    .ent-line {
      display: inline-block;
    }

    .title {
      margin-top: calc(16 * var(--u));
      font-family: var(--font-display);
      font-size: calc(130 * var(--u));
      line-height: 0.92;
      letter-spacing: calc(2.5 * var(--u));
      font-weight: 400;
      color: var(--ink);
      text-transform: uppercase;
      text-shadow: 0 calc(8 * var(--u)) calc(32 * var(--u)) rgba(0, 0, 0, 0.65);
    }

    .rule {
      margin-top: calc(26 * var(--u));
      display: flex;
      justify-content: center;
    }

    .rule span {
      display: block;
      width: calc(58 * var(--u));
      height: calc(3.2 * var(--u));
      background: var(--gold);
      border-radius: calc(2 * var(--u));
    }

    .lede {
      margin-top: calc(28 * var(--u));
      max-width: calc(560 * var(--u));
      font-family: var(--font-body);
      font-size: calc(15.5 * var(--u));
      font-weight: 400;
      line-height: 1.65;
      color: rgba(244, 237, 225, 0.85);
      text-shadow: 0 calc(2 * var(--u)) calc(12 * var(--u)) rgba(0, 0, 0, 0.7);
    }

    .cta {
      margin-top: calc(48 * var(--u));
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
    }

    .cta > a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #ffffff 0%, #f3e3bd 9%, #e9d19f 72%, #f7ecd8 100%);
      color: var(--btn-ink);
      font-family: var(--font-logo);
      font-size: calc(14.5 * var(--u));
      font-weight: 600;
      letter-spacing: calc(2.5 * var(--u));
      text-decoration: none;
      text-transform: uppercase;
      padding: calc(17 * var(--u)) calc(48 * var(--u));
      border-radius: calc(50 * var(--u));
      box-shadow: 0 calc(4 * var(--u)) calc(28 * var(--u)) rgba(201, 162, 75, 0.38), 0 0 calc(50 * var(--u)) rgba(201, 162, 75, 0.2);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, filter 0.25s ease;
      z-index: 5;
    }

    .cta > a:hover {
      transform: translateY(calc(-2 * var(--u))) scale(1.02);
      box-shadow: 0 calc(8 * var(--u)) calc(36 * var(--u)) rgba(201, 162, 75, 0.52), 0 0 calc(60 * var(--u)) rgba(201, 162, 75, 0.28);
      filter: brightness(1.05);
    }

    .cta > a:active {
      transform: translateY(0) scale(0.99);
    }

    .cta > a:focus-visible, .enroll:focus-visible {
      outline: calc(2.5 * var(--u)) solid var(--gold);
      outline-offset: calc(4 * var(--u));
    }

    /* ════════════════════════════════════════════════════════════════════════
       SLOTS LATERALES (.service-l, .service-r) Y ETIQUETAS (.label-l, .label-r)
       Recortados por bordes izquierdo y derecho
       ════════════════════════════════════════════════════════════════════════ */
    .service {
      position: fixed;
      top: calc((740 * var(--u)) + var(--vshift));
      width: calc(310 * var(--u));
      height: calc(310 * var(--u));
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
      padding: 0;
      margin: 0;
      z-index: 8;
      border-radius: 50%;
      -webkit-tap-highlight-color: transparent;
    }

    .service-l {
      left: calc(-75 * var(--u));
      transform: translateY(-50%);
    }

    .service-r {
      right: calc(-75 * var(--u));
      transform: translateY(-50%);
    }

    .service img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.22s ease-out, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), filter 0.35s ease;
    }

    .service img.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .service:hover img.is-active {
      transform: scale(1.07);
      filter: drop-shadow(0 0 calc(28 * var(--u)) rgba(201, 162, 75, 0.52));
    }

    .service:focus-visible {
      outline: calc(2.5 * var(--u)) solid var(--gold);
      outline-offset: calc(6 * var(--u));
    }

    .label {
      position: fixed;
      top: calc((740 * var(--u)) + var(--vshift));
      transform: translateY(-50%);
      font-family: var(--font-display);
      font-size: calc(26 * var(--u));
      letter-spacing: calc(3.5 * var(--u));
      color: var(--ink);
      text-transform: uppercase;
      pointer-events: none;
      z-index: 8;
      white-space: nowrap;
      text-shadow: 0 calc(4 * var(--u)) calc(16 * var(--u)) rgba(0, 0, 0, 0.85);
      transition: color 0.22s ease, transform 0.35s ease;
    }

    .label-l {
      left: calc(220 * var(--u));
    }

    .label-r {
      right: calc(220 * var(--u));
    }

    .service-l:hover ~ .label-l {
      color: var(--gold);
      transform: translateY(-50%) translateX(calc(4 * var(--u)));
    }

    .service-r:hover ~ .label-r {
      color: var(--gold);
      transform: translateY(-50%) translateX(calc(-4 * var(--u)));
    }

    /* ════════════════════════════════════════════════════════════════════════
       BOTÓN SCROLL DOWN
       ════════════════════════════════════════════════════════════════════════ */
    .scroll {
      position: fixed;
      bottom: calc(38 * var(--u));
      left: calc(50% - calc(var(--gutter) * var(--u) * 0.5));
      transform: translateX(-50%);
      width: calc(52 * var(--u));
      height: calc(52 * var(--u));
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: calc(1 * var(--u)) solid var(--rule);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }

    .scroll svg {
      width: calc(16 * var(--u));
      height: calc(20 * var(--u));
      transition: transform 0.25s ease;
    }

    .scroll:hover {
      background: rgba(201, 162, 75, 0.16);
      border-color: var(--gold);
      transform: translateX(-50%) translateY(calc(3 * var(--u)));
    }

    .scroll:hover svg {
      transform: translateY(calc(2.5 * var(--u)));
    }

    .scroll:focus-visible {
      outline: calc(2 * var(--u)) solid var(--gold);
      outline-offset: calc(4 * var(--u));
    }

    /* ════════════════════════════════════════════════════════════════════════
       ANIMACIÓN DE ENTRADA (DRAW / REVEAL / RISE / SETTLE / FADE)
       ════════════════════════════════════════════════════════════════════════ */
    html.anim:not(.play) .eyebrow .ent-line {
      transform: translateY(112%);
      opacity: 0;
    }
    html.anim:not(.play) .title .ent-line {
      transform: translateY(115%);
      opacity: 0;
    }
    html.anim:not(.play) .rule span {
      transform: scaleX(0);
    }
    html.anim:not(.play) .lede {
      opacity: 0;
      transform: translateY(calc(24 * var(--u)));
    }
    html.anim:not(.play) .cta > a {
      opacity: 0;
      transform: translateY(calc(22 * var(--u))) scale(0.94);
    }
    html.anim:not(.play) .service-l {
      opacity: 0;
      transform: translate(calc(-80 * var(--u)), -50%);
    }
    html.anim:not(.play) .service-r {
      opacity: 0;
      transform: translate(calc(80 * var(--u)), -50%);
    }
    html.anim:not(.play) .label-l {
      opacity: 0;
      transform: translate(calc(-20 * var(--u)), -50%);
    }
    html.anim:not(.play) .label-r {
      opacity: 0;
      transform: translate(calc(20 * var(--u)), -50%);
    }
    html.anim:not(.play) .navbar {
      opacity: 0;
      transform: translateY(calc(-20 * var(--u)));
    }
    html.anim:not(.play) .scroll {
      opacity: 0;
      transform: translate(-50%, calc(20 * var(--u)));
    }

    html.anim.play .eyebrow .ent-line {
      transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.12s, opacity 0.75s ease-out 0.12s;
      transform: translateY(0);
      opacity: 1;
    }
    html.anim.play .title .ent-line {
      transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.28s, opacity 0.85s ease-out 0.28s;
      transform: translateY(0);
      opacity: 1;
    }
    html.anim.play .rule span {
      transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.5s;
      transform: scaleX(1);
    }
    html.anim.play .lede {
      transition: opacity 0.7s ease-out 0.65s, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.65s;
      opacity: 1;
      transform: translateY(0);
    }
    html.anim.play .cta > a {
      transition: opacity 0.7s ease-out 0.8s, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.8s;
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    html.anim.play .service-l {
      transition: opacity 0.85s ease-out 0.85s, transform 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.85s;
      opacity: 1;
      transform: translate(0, -50%);
    }
    html.anim.play .service-r {
      transition: opacity 0.85s ease-out 0.85s, transform 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.85s;
      opacity: 1;
      transform: translate(0, -50%);
    }
    html.anim.play .label-l {
      transition: opacity 0.75s ease-out 0.95s, transform 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.95s;
      opacity: 1;
      transform: translate(0, -50%);
    }
    html.anim.play .label-r {
      transition: opacity 0.75s ease-out 0.95s, transform 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.95s;
      opacity: 1;
      transform: translate(0, -50%);
    }
    html.anim.play .navbar {
      transition: opacity 0.6s ease-out 0.15s, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
      opacity: 1;
      transform: translateY(0);
    }
    html.anim.play .scroll {
      transition: opacity 0.6s ease-out 1.1s, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.1s;
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ════════════════════════════════════════════════════════════════════════
       RESPONSIVE — Seis Tiers Exactos
       ════════════════════════════════════════════════════════════════════════ */

    /* Tier 1: Colapso de Nav */
    @media (max-width: 860px) {
      .burger {
        display: flex;
      }
      .links {
        position: fixed;
        top: calc(76 * var(--u));
        right: calc(20 * var(--u));
        background: rgba(18, 13, 8, 0.97);
        border: calc(1 * var(--u)) solid rgba(201, 162, 75, 0.28);
        border-radius: calc(16 * var(--u));
        padding: calc(24 * var(--u)) calc(30 * var(--u));
        flex-direction: column;
        align-items: stretch;
        gap: calc(18 * var(--u));
        box-shadow: 0 calc(14 * var(--u)) calc(45 * var(--u)) rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        opacity: 0;
        pointer-events: none;
        transform: translateY(calc(-10 * var(--u))) scale(0.96);
        transition: opacity 0.22s ease, transform 0.22s ease;
        z-index: 100;
      }
      .navrow[data-open="true"] .links {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0) scale(1);
      }
      .links a {
        font-size: calc(16 * var(--u));
        padding: calc(4 * var(--u)) 0;
      }
      .links .enroll {
        text-align: center;
        margin-top: calc(6 * var(--u));
      }
    }

    /* Tier 2: Tablet */
    @media (max-width: 1024px) {
      .service {
        width: calc(240 * var(--u));
        height: calc(240 * var(--u));
      }
      .service-l {
        left: calc(-60 * var(--u));
      }
      .service-r {
        right: calc(-60 * var(--u));
      }
      .label-l {
        left: calc(180 * var(--u));
        font-size: calc(20 * var(--u));
      }
      .label-r {
        right: calc(180 * var(--u));
        font-size: calc(20 * var(--u));
      }
      .title {
        font-size: calc(110 * var(--u));
      }
    }

    /* Tier 3: Teléfono */
    @media (max-width: 640px) {
      .title {
        font-size: calc(82 * var(--u));
      }
      .eyebrow {
        font-size: calc(14 * var(--u));
        letter-spacing: calc(6 * var(--u));
      }
      .lede {
        font-size: calc(14 * var(--u));
        max-width: calc(440 * var(--u));
        line-height: 1.55;
      }
      .service {
        width: calc(170 * var(--u));
        height: calc(170 * var(--u));
      }
      .service-l {
        left: calc(-45 * var(--u));
      }
      .service-r {
        right: calc(-45 * var(--u));
      }
      .label-l, .label-r {
        display: none;
      }
      .cta > a {
        padding: calc(15 * var(--u)) calc(38 * var(--u));
        font-size: calc(13.5 * var(--u));
      }
    }

    /* Tier 4: Ocultar Scroll en Pantallas Bajas */
    @media (max-height: 580px) {
      .scroll {
        display: none !important;
      }
    }

    /* Tier 5: Tier "Short" */
    @media (max-height: 700px) {
      .copy {
        top: calc(130 * var(--u));
      }
      .eyebrow {
        font-size: calc(13 * var(--u));
      }
      .title {
        font-size: calc(76 * var(--u));
        margin-top: calc(8 * var(--u));
      }
      .rule {
        margin-top: calc(14 * var(--u));
      }
      .lede {
        margin-top: calc(14 * var(--u));
        font-size: calc(13 * var(--u));
        line-height: 1.45;
      }
      .cta {
        margin-top: calc(20 * var(--u));
      }
      .service {
        top: calc(440 * var(--u));
        width: calc(170 * var(--u));
        height: calc(170 * var(--u));
      }
      .label-l, .label-r {
        top: calc(440 * var(--u));
        font-size: calc(18 * var(--u));
      }
    }

    /* Tier 6: Teléfono Angosto */
    @media (max-width: 380px) {
      .title {
        font-size: calc(68 * var(--u));
      }
      .eyebrow {
        font-size: calc(12 * var(--u));
        letter-spacing: calc(4 * var(--u));
      }
      .lede {
        font-size: calc(12.5 * var(--u));
      }
      .cta > a {
        padding: calc(13 * var(--u)) calc(28 * var(--u));
        font-size: calc(12 * var(--u));
        letter-spacing: calc(1.5 * var(--u));
      }
      .service {
        width: calc(140 * var(--u));
        height: calc(140 * var(--u));
      }
    }

    /* Accesibilidad: Reducción de movimiento */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      html.anim:not(.play) *, html.anim.play * {
        transform: none !important;
        opacity: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="sky">
      <!-- 3 x <video data-service="corte|barba|combo">
          Corte Clásico: class="is-active" autoplay muted loop playsinline preload="auto"
          Barba & Combo: muted loop playsinline preload="none" data-src=CLIP (NO src) -->
      <video data-service="corte" class="is-active" autoplay muted loop playsinline preload="auto" src="https://assets.mixkit.co/videos/42864/42864-720.mp4" aria-hidden="true"></video>
      <video data-service="barba" muted loop playsinline preload="none" data-src="https://assets.mixkit.co/videos/42863/42863-720.mp4" aria-hidden="true"></video>
      <video data-service="combo" muted loop playsinline preload="none" data-src="https://assets.mixkit.co/videos/42866/42866-720.mp4" aria-hidden="true"></video>
    </div>

    <div class="ui">
      <header class="navbar">
        <div class="navrow">
          <a class="logo" href="#">tuturno<i>barber</i></a>
          <nav class="links" id="site-nav">
            <a href="#" aria-current="page">Servicios</a>
            <a href="#">Barberos</a>
            <a href="#">Galería</a>
            <a href="#">Contacto</a>
            <a class="enroll" href="#">Reservar</a>
          </nav>
          <button class="burger" type="button" aria-label="Abrir navegación"
                  aria-expanded="false" aria-controls="site-nav">
            <span></span><span></span><span></span>
          </button>
        </div>
      </header>

      <div class="copy">
        <div class="col eyebrow"><span class="ent-mask"><span class="ent-line">SERVICIO</span></span></div>
        <h1 class="col title"><span class="ent-mask"><span class="ent-line">CORTE CLÁSICO</span></span></h1>
        <div class="col rule"><span></span></div>
        <p class="col lede">El corte que nunca pasa de moda. Estilo, precisión y una
           charla honesta mientras trabajamos. Cupos limitados <br>esta semana —
           reserva tu turno antes de que se acaben.</p>

          lede: 'El corte que nunca pasa de moda. Estilo, precisión y una charla honesta mientras trabajamos. Cupos limitados <br>esta semana — reserva tu turno antes de que se acaben.'
        },
        barba: {
          name: 'BARBA & AFEITADO',
          still: 'https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=1920&q=80',
          lede: 'Afeitado clásico con navaja y toalla caliente. El ritual completo para dejar la barba perfecta. Cupos limitados <br>esta semana — reserva tu turno antes de que se acaben.'
        },
        combo: {
          name: 'COMBO PREMIUM',
          still: 'https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=1920&q=80',
          lede: 'Corte + barba en una sola sesión, al precio justo. La experiencia completa de barbería. Cupos limitados <br>esta semana — reserva tu turno antes de que se acaben.'
        }
      };

      const sky = document.querySelector('.sky');
      const videos = document.querySelectorAll('.sky video');
      const titleLine = document.querySelector('.title .ent-line');
      const ledeEl = document.querySelector('.copy .lede');
      const btnL = document.querySelector('.service-l');
      const btnR = document.querySelector('.service-r');
      const labelL = document.querySelector('.label-l');
      const labelR = document.querySelector('.label-r');

      function warm(service) {
        const vid = document.querySelector('.sky video[data-service="' + service + '"]');
        if (vid && !vid.src && vid.dataset.src) {
          vid.src = vid.dataset.src;
          vid.preload = 'auto';
        }
      }

      function show(next) {
        if (!SERVICES[next]) return;

        // 1. Activar / Pausar videos y actualizar backdrop still
        videos.forEach(function(vid) {
          if (vid.dataset.service === next) {
            if (!vid.src && vid.dataset.src) {
              vid.src = vid.dataset.src;
              vid.load();
            }
            vid.classList.add('is-active');
            var playPromise = vid.play();
            if (playPromise !== undefined) {
              playPromise.catch(function() {});
            }
          } else {
            vid.classList.remove('is-active');
            vid.pause();
          }
        });

        if (sky && SERVICES[next].still) {
          sky.style.backgroundImage = 'url("' + SERVICES[next].still + '")';
        }

        // 2. Actualizar Titular y Lede
        if (titleLine) {
          titleLine.textContent = SERVICES[next].name;
        }
        if (ledeEl) {
          ledeEl.innerHTML = SERVICES[next].lede;
        }

        // 3. Repartir rest = ORDER menos next entre slot izquierdo y derecho sin tocar img.src
        const rest = ORDER.filter(function(s) { return s !== next; });
        const leftService = rest[0];
        const rightService = rest[1];

        if (btnL) {
          btnL.dataset.service = leftService;
          btnL.setAttribute('aria-label', 'Ver servicio: ' + SERVICES[leftService].name);
          btnL.querySelectorAll('img').forEach(function(img) {
            if (img.dataset.service === leftService) {
              img.classList.add('is-active');
            } else {
              img.classList.remove('is-active');
            }
          });
        }

        if (btnR) {
          btnR.dataset.service = rightService;
          btnR.setAttribute('aria-label', 'Ver servicio: ' + SERVICES[rightService].name);
          btnR.querySelectorAll('img').forEach(function(img) {
            if (img.dataset.service === rightService) {
              img.classList.add('is-active');
            } else {
              img.classList.remove('is-active');
            }
          });
        }

        if (labelL) {
          labelL.textContent = SERVICES[leftService].name;
        }
        if (labelR) {
          labelR.textContent = SERVICES[rightService].name;
        }
      }

      // Binds de click en ambos botones
      if (btnL) {
        btnL.addEventListener('click', function() {
          show(this.dataset.service);
        });
      }
      if (btnR) {
        btnR.addEventListener('click', function() {
          show(this.dataset.service);
        });
      }

      // Precalentamiento en idle / timeout
      if ('requestIdleCallback' in window) {
        requestIdleCallback(function() { ORDER.forEach(warm); });
      } else {
        setTimeout(function() { ORDER.forEach(warm); }, 1200);
      }

      // Estado inicial al cargar
      show('corte');

      // ════════════════════════════════════════════════════════════════════════
      // MENÚ BURGER
      // ════════════════════════════════════════════════════════════════════════
      const burger = document.querySelector('.burger');
      const navrow = document.querySelector('.navrow');
      const siteNav = document.getElementById('site-nav');

      function setBurger(open) {
        if (!navrow || !burger) return;
        navrow.dataset.open = open ? 'true' : 'false';
        burger.setAttribute('aria-expanded', open ? 'true' : 'false');
        burger.setAttribute('aria-label', open ? 'Cerrar navegación' : 'Abrir navegación');
      }

      if (burger) {
        burger.addEventListener('click', function(e) {
          e.stopPropagation();
          const isOpen = navrow.dataset.open === 'true';
          setBurger(!isOpen);
        });
      }

      // Cierra con clic afuera
      document.addEventListener('click', function(e) {
        if (navrow && navrow.dataset.open === 'true' && siteNav && !siteNav.contains(e.target) && !burger.contains(e.target)) {
          setBurger(false);
        }
      });

      // Cierra con Escape devolviendo foco
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && navrow && navrow.dataset.open === 'true') {
          setBurger(false);
          if (burger) burger.focus();
        }
      });

      // Cierra con clic en cualquier link
      if (siteNav) {
        siteNav.querySelectorAll('a').forEach(function(link) {
          link.addEventListener('click', function() {
            setBurger(false);
          });
        });
      }

      // Scroll Button
      const scrollBtn = document.querySelector('.scroll');
      if (scrollBtn) {
        scrollBtn.addEventListener('click', function() {
          window.scrollTo({ top: window.innerHeight, behavior: 'smooth' });
        });
      }
    })();
  </script>
</body>
</html>
